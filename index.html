      /* Training: "Hit me!" over the scarecrow, and the card of attacks to try on it. */

      .book-got { position: fixed; z-index: 3; pointer-events: none; display: flex; flex-direction: column; align-items: center; transform: translate(-50%, -100%); animation: book-got-pop 1.6s ease-out forwards; }

      @keyframes book-got-pop { 0% { opacity: 0; translate: 0 8px; } 15% { opacity: 1; translate: 0 0; } 75% { opacity: 1; translate: 0 -2px; } 100% { opacity: 0; translate: 0 -10px; } }

      .hitme svg { display: block; width: 30px; height: 30px; overflow: visible; fill: #e0a23c; filter: drop-shadow(0 1px 2px rgba(0,0,0,.35)); animation: tutorial-bob .9s ease-in-out infinite alternate; }
      #match-toast { position: fixed; top: calc(var(--edge-top) + 50px); left: 50%; transform: translate(-50%, 6px); z-index: 3; pointer-events: none; padding: 7px 14px; border-radius: 999px; background: var(--hud-bg); color: var(--hud-fg); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); font: 600 13px/1.2 system-ui, -apple-system, sans-serif; white-space: nowrap; opacity: 0; transition: opacity .25s, transform .25s; }

      @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .match-btn .glyph { fill: #ffd27a; } :root:not([data-theme="light"]) .match-btn .red { fill: #ff7a6b; } :root:not([data-theme="light"]) .match-btn .green { fill: #7fd690; } :root:not([data-theme="light"]) .match-btn .plum { fill: #c7a6f2; } }
      :root[data-theme="dark"] .match-btn .glyph { fill: #ffd27a; } :root[data-theme="dark"] .match-btn .red { fill: #ff7a6b; } :root[data-theme="dark"] .match-btn .green { fill: #7fd690; } :root[data-theme="dark"] .match-btn .plum { fill: #c7a6f2; }
      #match-end { position: fixed; inset: 0; z-index: 5; display: grid; place-items: center; padding: 16px; background: radial-gradient(circle at 50% 45%, rgba(201,211,209,.35), rgba(35,50,42,.55)); backdrop-filter: blur(2px) saturate(.8); -webkit-backdrop-filter: blur(2px) saturate(.8); opacity: 0; transition: opacity .45s; touch-action: none; }

      @keyframes match-spot { to { box-shadow: 0 0 0 3px #e0a23c, 0 0 26px 8px rgba(224,162,60,.75); transform: translateY(-2px); } }
