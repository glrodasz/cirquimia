<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Cirquimia Meadow Test</title>
    <style>
      :root { --sky: #c9d3d1; --hud-bg: rgba(255,255,255,.72); --hud-fg: #23322a; --hud-border: rgba(35,50,42,.15); }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) { --hud-bg: rgba(20,28,24,.72); --hud-fg: #e6efe9; --hud-border: rgba(230,239,233,.18); }
      }
      :root[data-theme="dark"] { --hud-bg: rgba(20,28,24,.72); --hud-fg: #e6efe9; --hud-border: rgba(230,239,233,.18); }
      html, body { margin: 0; height: 100%; overflow: hidden; background: var(--sky); touch-action: none; overscroll-behavior: none; }
      canvas { display: block; width: 100%; height: 100%; -webkit-tap-highlight-color: transparent; }
      #dev-gear { position: fixed; top: max(12px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right)); width: 40px; height: 40px; padding: 9px; border-radius: 50%; border: 1px solid var(--hud-border); background: var(--hud-bg); color: var(--hud-fg); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); cursor: pointer; z-index: 3; opacity: .75; transition: opacity .2s, transform .3s; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
      #dev-gear:hover, #dev-gear.open { opacity: 1; }
      #dev-gear.open { transform: rotate(60deg); }
      #dev-gear svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linejoin: round; }
      #dev-panel { position: fixed; top: calc(max(12px, env(safe-area-inset-top)) + 48px); right: max(12px, env(safe-area-inset-right)); width: min(320px, calc(100vw - 24px)); max-height: calc(100dvh - 80px - max(16px, env(safe-area-inset-bottom)) - 70px); overflow: auto; box-sizing: border-box; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--hud-border); background: var(--hud-bg); color: var(--hud-fg); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); font: 400 12.5px/1.35 system-ui, -apple-system, sans-serif; z-index: 3; touch-action: pan-y; overscroll-behavior: contain; }
      #dev-panel[hidden] { display: none; }
      #dev-panel header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; font-size: 13.5px; }
      #dev-panel section { border-top: 1px solid var(--hud-border); padding: 10px 0 4px; }
      #dev-panel h3 { margin: 0 0 8px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; opacity: .7; }
      #dev-panel h4 { margin: 10px 0 4px; font-size: 11.5px; font-weight: 600; }
      #dev-panel button { font: inherit; color: inherit; background: transparent; border: 1px solid var(--hud-border); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
      #dev-panel button:hover { border-color: currentColor; }
      #dev-panel button:focus-visible, #dev-panel input:focus-visible, #dev-gear:focus-visible { outline: 2px solid #c98a2e; outline-offset: 2px; }
      #dev-panel .dev-close { border: 0; font-size: 20px; line-height: 1; padding: 2px 8px; }
      #dev-panel .dev-primary { width: 100%; padding: 9px 10px; font-weight: 600; background: #3f5a57; color: #f1f5f2; border-color: #3f5a57; margin-bottom: 8px; }
      #dev-panel .dev-row { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; }
      #dev-panel .dev-row input[type=text] { flex: 1; min-width: 0; font: 500 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; color: inherit; background: transparent; border: 1px solid var(--hud-border); border-radius: 8px; padding: 6px 8px; }
      #dev-panel .dev-stats { display: grid; grid-template-columns: 1fr auto; gap: 3px 10px; margin: 6px 0; }
      #dev-panel .dev-stats dt { opacity: .75; }
      #dev-panel .dev-stats dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
      #dev-panel .dev-ok { color: #3f8a5c; }
      #dev-panel .dev-warn { color: #c0562f; }
      #dev-panel ul { list-style: none; margin: 6px 0; padding: 0; display: grid; gap: 4px; }
      #dev-panel .dev-mat { display: inline-block; min-width: 54px; margin-right: 6px; font-weight: 600; }
      #dev-panel .dev-roca { color: #6f7b7e; } #dev-panel .dev-tierra { color: #8a7454; } #dev-panel .dev-agua { color: #3f7f8f; }
      #dev-panel .dev-fuego { color: #c0562f; } #dev-panel .dev-magia { color: #3d9a8a; } #dev-panel .dev-restos { color: #7a6656; }
      #dev-panel .dev-note { margin: 4px 0; opacity: .7; font-size: 11.5px; }
      #dev-panel .dev-slider { display: grid; grid-template-columns: 1fr 96px 38px; gap: 8px; align-items: center; margin: 3px 0; }
      #dev-panel .dev-slider input { width: 100%; accent-color: #3f5a57; }
      #dev-panel .dev-slider output { text-align: right; font-variant-numeric: tabular-nums; }
      #dev-panel .dev-row > label { min-width: 62px; }
      #dev-panel .dev-toggle { flex: 1; padding: 6px 4px; }
      #dev-panel .dev-toggle[aria-pressed="true"] { background: #3f5a57; color: #f1f5f2; border-color: #3f5a57; }
      #dev-panel .dev-check { display: flex; gap: 8px; align-items: center; margin: 6px 0; }
      #match { position: fixed; top: max(12px, env(safe-area-inset-top)); left: max(12px, env(safe-area-inset-left)); display: flex; gap: 10px; z-index: 3; }
      .match-btn { position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 0; border: 0; background: none; color: var(--hud-fg); cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; font: 700 11px/1.1 system-ui, -apple-system, sans-serif; letter-spacing: .03em; }
      .match-btn .disc { display: block; width: 50px; height: 50px; border-radius: 50%; background: var(--hud-bg); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); box-shadow: 0 2px 8px rgba(20,28,24,.18); transition: transform .15s, box-shadow .15s; }
      .match-btn:hover .disc { box-shadow: 0 3px 12px rgba(20,28,24,.28); }
      .match-btn:active .disc { transform: scale(.94); }
      .match-btn:focus-visible { outline: none; } .match-btn:focus-visible .disc { outline: 2px solid #c98a2e; outline-offset: 2px; }
      .match-btn svg { display: block; width: 100%; height: 100%; overflow: visible; }
      .match-btn .ring { fill: var(--hud-fg); opacity: .32; }
      .match-btn .glyph { fill: #b5761f; }
      .match-btn .red { fill: #d9483b; } .match-btn .green { fill: #3fae5a; }
      .match-btn .faint { fill: var(--hud-fg); opacity: .3; }
      .match-btn .red, .match-btn .green, .match-btn .glyph { filter: drop-shadow(0 .6px .4px rgba(0,0,0,.18)); }
      .match-btn .badge { position: absolute; top: 31px; right: -5px; min-width: 20px; height: 20px; box-sizing: border-box; padding: 0 5px; border-radius: 10px; background: #e0a23c; color: #23322a; font: 800 12.5px/20px system-ui, -apple-system, sans-serif; text-align: center; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
      .match-btn .badge:empty { display: none; }
      .match-btn .cap { padding: 2px 7px; border-radius: 999px; background: var(--hud-bg); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
      .match-btn .cap::after { content: " ↻"; opacity: .55; font-weight: 600; }
      #match-toast { position: fixed; top: calc(max(12px, env(safe-area-inset-top)) + 84px); left: 50%; transform: translate(-50%, -6px); z-index: 3; pointer-events: none; padding: 7px 14px; border-radius: 999px; background: var(--hud-bg); color: var(--hud-fg); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); font: 600 13px/1.2 system-ui, -apple-system, sans-serif; white-space: nowrap; opacity: 0; transition: opacity .25s, transform .25s; }
      #match-toast.show { opacity: 1; transform: translate(-50%, 0); }
      @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .match-btn .glyph { fill: #ffd27a; } :root:not([data-theme="light"]) .match-btn .red { fill: #ff7a6b; } :root:not([data-theme="light"]) .match-btn .green { fill: #7fd690; } }
      :root[data-theme="dark"] .match-btn .glyph { fill: #ffd27a; } :root[data-theme="dark"] .match-btn .red { fill: #ff7a6b; } :root[data-theme="dark"] .match-btn .green { fill: #7fd690; }
      #fps { position: fixed; top: calc(max(12px, env(safe-area-inset-top)) + 84px); left: max(12px, env(safe-area-inset-left)); z-index: 3; pointer-events: none; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--hud-border); background: var(--hud-bg); color: var(--hud-fg); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); font: 600 13px/1.2 system-ui, -apple-system, sans-serif; font-variant-numeric: tabular-nums; }
      #fps[hidden] { display: none; }
      @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) #dev-panel .dev-primary { background: #9fbcb4; color: #14201c; border-color: #9fbcb4; } }
      :root[data-theme="dark"] #dev-panel .dev-primary { background: #9fbcb4; color: #14201c; border-color: #9fbcb4; }
      #ink { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
      #ammo { position: fixed; left: 16px; right: 16px; bottom: calc(max(16px, env(safe-area-inset-bottom)) + 8px); display: flex; justify-content: center; gap: 8px; min-height: 54px; pointer-events: none; }
      #ammo .slot { pointer-events: auto; width: 54px; height: 54px; padding: 0; border-radius: 50%; border: 0; background: var(--hud-bg); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); color: #b5761f; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; transition: transform .15s, box-shadow .15s; }
      #ammo .slot svg { display: block; width: 100%; height: 100%; fill: currentColor; overflow: visible; }
      #ammo .slot .ring { fill: var(--hud-fg); opacity: .32; transition: opacity .15s, fill .15s; }
      #ammo .slot .glyph { opacity: .92; filter: drop-shadow(0 .6px .4px rgba(0,0,0,.18)); }
      #ammo .slot.selected .ring { fill: #e0a23c; opacity: .95; }
      #ammo .slot.triangle { color: #b0482c; }
      #ammo .slot.square { color: #3f6f8a; }
      #ammo .slot.triangleDown { color: #8a3f5c; }
      #ammo .slot.rhombus { color: #4f7a52; }
      #ammo .slot.pentagram { color: #6a4f8a; }
      #ammo .slot.charged.triangle { background: radial-gradient(circle, #ffcf7a 0%, #f08a3a99 45%, var(--hud-bg) 75%); }
      #ammo .slot.charged.triangleDown { background: radial-gradient(circle, #d9ecef 0%, #7fb3c299 45%, var(--hud-bg) 75%); }
      #ammo .slot.selected { transform: translateY(-8px) scale(1.08); box-shadow: 0 6px 18px rgba(255,170,60,.45); }
      @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) #ammo .slot { color: #ffd27a; } :root:not([data-theme="light"]) #ammo .slot.triangle { color: #ff9a76; } :root:not([data-theme="light"]) #ammo .slot.square { color: #8cc4dc; } :root:not([data-theme="light"]) #ammo .slot.triangleDown { color: #e899b6; } :root:not([data-theme="light"]) #ammo .slot.rhombus { color: #9fd0a2; } :root:not([data-theme="light"]) #ammo .slot.pentagram { color: #c3a8e8; } }
      :root[data-theme="dark"] #ammo .slot { color: #ffd27a; } :root[data-theme="dark"] #ammo .slot.triangle { color: #ff9a76; } :root[data-theme="dark"] #ammo .slot.square { color: #8cc4dc; } :root[data-theme="dark"] #ammo .slot.triangleDown { color: #e899b6; } :root[data-theme="dark"] #ammo .slot.rhombus { color: #9fd0a2; } :root[data-theme="dark"] #ammo .slot.pentagram { color: #c3a8e8; }
      body.aiming canvas { cursor: crosshair; }
      .hp { position: fixed; left: 0; top: 0; width: 38px; height: 4px; margin: -16px 0 0 -19px; border-radius: 3px; background: rgba(20,28,24,.55); box-shadow: 0 0 0 1px rgba(255,255,255,.55); overflow: hidden; pointer-events: none; z-index: 1; will-change: transform; }
      .hp[hidden] { display: none; }
      .hp-fill { height: 100%; transform-origin: left; transition: transform .25s ease-out; }
      .hp.ko .hp-fill { filter: grayscale(1) brightness(.8); }
      .hp.hurt { animation: hp-shake .25s; }
      @keyframes hp-shake { 25% { margin-left: -22px; } 75% { margin-left: -16px; } }
      .dmg { position: fixed; z-index: 2; pointer-events: none; font: 800 18px/1 system-ui, -apple-system, sans-serif; text-shadow: 0 1px 0 #1e2622, 0 0 6px rgba(0,0,0,.45); transform: translate(-50%, -100%); animation: dmg-pop .9s ease-out forwards; }
      @keyframes dmg-pop { 0% { opacity: 0; transform: translate(-50%, -60%) scale(.6); } 15% { opacity: 1; transform: translate(-50%, -110%) scale(1.25); } 100% { opacity: 0; transform: translate(-50%, -260%) scale(1); } }
    </style>
  </head>
  <body>
    <div id="hud" hidden>
      <button id="tilt" type="button">Miniatura: on</button>
      <span id="fps">-- fps</span>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
