# Builds the game and deploys it to Cloudflare Pages.
# main -> production (https://cirquimia.pages.dev)
# pull requests -> preview URL per branch, linked from the PR's deployments
#                  and from a sticky PR comment updated on every push.
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write # semantic-release pushes the version tag and the GitHub release (main only)
  issues: write # semantic-release comments on released issues and PRs
  deployments: write
  pull-requests: write

env:
  PAGES_PROJECT: cirquimia

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the build reads its version from the latest v* tag

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

      # Versioning (0.x until we call it 1.0): fix -> patch, feat -> minor, see AGENTS.md and .releaserc.json.
      # Runs before the build so production ships the new version. No commit is pushed back to main.
      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # First run only: mark where versioning starts, or semantic-release would open at 1.0.0.
          if [ -z "$(git tag -l 'v[0-9]*')" ]; then
            git tag v0.1.0 57f32a6038c22994aa6bf1bd94780d6ec3e91ea4 # main before versioning (PR #74)
            git push origin v0.1.0
          fi
          npx -y -p semantic-release@25.0.9 -p conventional-changelog-conventionalcommits@9.3.1 semantic-release

      - run: npm run build

      # Forks and repos without the Cloudflare secrets still get a build check.
      - name: Check Cloudflare secrets
        id: secrets
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          echo "branch=$(printf '%s' "$BRANCH" | tr -c 'A-Za-z0-9._/-' '-')" >> "$GITHUB_OUTPUT"
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set; skipping deploy."
          fi

      - name: Deploy to Cloudflare Pages
        id: deploy
        if: steps.secrets.outputs.ok == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          # Creates the Pages project on the first run; a no-op afterwards.
          preCommands: npx wrangler pages project create ${{ env.PAGES_PROJECT }} --production-branch=main || true
          command: pages deploy dist --project-name=${{ env.PAGES_PROJECT }} --branch=${{ steps.secrets.outputs.branch }}

      - name: Summary
        if: steps.deploy.outcome == 'success'
        run: |
          echo "### Cirquimia deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Deployment: ${{ steps.deploy.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch alias: ${{ steps.deploy.outputs.pages-deployment-alias-url }}" >> "$GITHUB_STEP_SUMMARY"

      # One comment per PR, edited in place on every push.
      - name: Comment preview URL on PR
        if: steps.deploy.outcome == 'success' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const marker = '<!-- cirquimia-preview -->';
            const { ALIAS_URL, DEPLOY_URL, SHA } = process.env;
            const body = [
              marker,
              '### ⚗️ Preview de Cirquimia',
              '',
              `**Probar aquí:** ${ALIAS_URL || DEPLOY_URL}`,
              '',
              '| | |',
              '|---|---|',
              `| Rama (siempre la última versión) | ${ALIAS_URL || '—'} |`,
              `| Este push (\`${SHA.slice(0, 7)}\` fusionado con la base) | ${DEPLOY_URL} |`,
              `| Actualizado | ${new Date().toISOString().replace('T', ' ').slice(0, 16)} UTC |`,
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
