<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" role="img">
  <title>Cirquimia system context</title>
  <desc>Players open Cirquimia in a browser served by Cloudflare Pages; contributors push to GitHub, where Actions tests, builds and deploys every change.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M2 1L8 5L2 9"/></marker>
    <marker id="al" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk e-coral" d="M2 1L8 5L2 9"/></marker>
  </defs>

  <g class="s-gray"><rect x="150" y="30" width="220" height="56" rx="28"/>
    <text class="th" x="260" y="50" text-anchor="middle" dominant-baseline="central">Player</text>
    <text class="ts" x="260" y="68" text-anchor="middle" dominant-baseline="central">phone or desktop browser</text></g>

  <g class="s-gray"><rect x="510" y="30" width="220" height="56" rx="28"/>
    <text class="th" x="620" y="50" text-anchor="middle" dominant-baseline="central">Contributor</text>
    <text class="ts" x="620" y="68" text-anchor="middle" dominant-baseline="central">branch and pull request</text></g>

  <g class="s-teal"><rect x="150" y="160" width="300" height="80" rx="8"/>
    <text class="th" x="300" y="188" text-anchor="middle" dominant-baseline="central">Cirquimia</text>
    <text class="ts" x="300" y="210" text-anchor="middle" dominant-baseline="central">Three.js game in the browser</text></g>

  <g class="s-gray"><rect x="150" y="314" width="220" height="56" rx="8"/>
    <text class="th" x="260" y="334" text-anchor="middle" dominant-baseline="central">Cloudflare Pages</text>
    <text class="ts" x="260" y="352" text-anchor="middle" dominant-baseline="central">static site, locale redirect</text></g>

  <g class="s-gray"><rect x="510" y="314" width="220" height="56" rx="8"/>
    <text class="th" x="620" y="334" text-anchor="middle" dominant-baseline="central">GitHub Actions</text>
    <text class="ts" x="620" y="352" text-anchor="middle" dominant-baseline="central">test, build, deploy</text></g>

  <path class="arr" d="M260 86 V160" marker-end="url(#a)"/>
  <text class="ts" x="330" y="123" text-anchor="middle" dominant-baseline="central">draws and taps</text>

  <path class="arr" d="M260 314 V240" marker-end="url(#a)"/>
  <text class="ts" x="330" y="277" text-anchor="middle" dominant-baseline="central">serves the game</text>

  <path class="arr" d="M620 86 V314" marker-end="url(#a)"/>
  <text class="ts" x="700" y="200" text-anchor="middle" dominant-baseline="central">pushes branches</text>

  <path class="arr" d="M510 342 H370" marker-end="url(#a)"/>
  <text class="ts" x="440" y="328" text-anchor="middle" dominant-baseline="central">deploys builds</text>
</svg>
